name: R-CMD-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R_KEEP_PKG_SOURCE: yes
      EPIC2_RUN_COMMON_BUILD_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::BiocManager
          needs: check
      - name: Install workflow dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Build and check
        shell: bash
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --no-build-vignettes EPIC2_*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R-check-results
          path: EPIC2.Rcheck
